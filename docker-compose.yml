services:
  paride-advisory:
    container_name: paride-advisory
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    networks:
      - default
      - proxy

networks:
  default:
    driver: bridge
  proxy:
    external: true
    name: proxy
